<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#050816;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#0b1023;
}

nav h2{
    color:#00f5ff;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li{
    cursor:pointer;
}

.container{
    padding:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#11182f;
    padding:30px;
    border-radius:20px;
    transition:0.4s;
    border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
    transform:translateY(-10px);
}

.card h3{
    margin-bottom:15px;
    color:#00f5ff;
}

.card p{
    color:#cfcfcf;
}

</style>
</head>

<body>

<nav>
    <h2>StudyAI</h2>

    <ul>
        <li>
        <a href="{% url 'contact' %}" 
        style="color:white; text-decoration:none;">
        Contact
        </a>
        </li>
        <li>
        <a href="{% url 'logout' %}" 
        style="color:white; text-decoration:none;">
        Logout
        </a>
        </li>
        <li>
        <a href="{% url 'about' %}" 
        style="color:white; text-decoration:none;">
        About us
        </a>
        </li>                
    </ul>
</nav>

<div class="container">

    <h1 style="margin-bottom:30px;">
        Welcome To Dashboard 🚀
    </h1>

    <div class="cards">

        <a href="{% url 'AI' %}" style="text-decoration:none; color:white;">

            <div class="card">
                <h3>Ask AI</h3>
                <p>Ask study related questions instantly.</p>
            </div>

        </a>

        <div class="card">
            <h3>Summarizer</h3>
            <p>Convert long notes into short summaries.</p>
        </div>

        <div class="card">
            <h3>History</h3>
            <p>View your previous AI conversations.</p>
        </div>

    </div>

</div>

</body>
</html>
