{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:#050816;
            position:relative;
        }

        /* Animated Grid Background */
        body::before{
            content:"";
            position:absolute;
            width:200%;
            height:200%;
            background-image:
            linear-gradient(rgba(0,255,255,0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,255,0.15) 1px, transparent 1px);
            background-size:60px 60px;
            transform:perspective(500px) rotateX(75deg);
            animation:gridMove 12s linear infinite;
        }

        @keyframes gridMove{
            0%{
                transform:perspective(500px) rotateX(75deg) translateY(0);
            }
            100%{
                transform:perspective(500px) rotateX(75deg) translateY(60px);
            }
        }

        /* Neon Glow Circles */
        .glow{
            position:absolute;
            border-radius:50%;
            filter:blur(100px);
            opacity:0.7;
            animation:float 8s infinite alternate;
        }


        @keyframes float{
            from{
                transform:translateY(0px) translateX(0px);
            }
            to{
                transform:translateY(40px) translateX(30px);
            }
        }

        /* Form Container */
        .form-container{
            position:relative;
            z-index:10;
            width:100%;
            max-width:400px;
            padding:35px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 0 30px rgba(0,255,255,0.2);
            color:white;
        }

        .form-container h2{
            text-align:center;
            margin-bottom:20px;
            font-size:28px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            color:#ccc;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:10px;
            background:rgba(255,255,255,0.1);
            color:white;
            border:1px solid rgba(255,255,255,0.15);
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#00ffff;
            box-shadow:0 0 15px #00ffff;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#00ffff,#ff00ff);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            transform:scale(1.04);
            box-shadow:0 0 20px #00ffff;
        }

        .link{
            margin-top:15px;
            text-align:center;
            color:#ccc;
        }

        .link a{
            color:#00ffff;
            text-decoration:none;
        }

        /* Table Styling */
        table{
            position:absolute;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            color:white;
            border-collapse:collapse;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
        }

        td{
            padding:10px 20px;
            border:1px solid rgba(255,255,255,0.2);
        }

        @media(max-width:500px){
            .form-container{
                margin:15px;
                padding:25px;
            }

            table{
                width:95%;
                font-size:12px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <form action="{% url 'registration' %}" method="post">
            {% csrf_token %}
            <div class="input-group">
                <label>name</label>
                <input type="text" name="name" placeholder="name" required>
            </div>

            <div class="input-group">
                <label>email</label>
                <input type="email" name="email" placeholder=" email" required>
            </div>

            <div class="input-group">
                <label>password</label>
                <input type="password" name="password" placeholder=" password" required>
            </div>

            <div class="input-group">
                <label>confirm Password</label>
                <input type="password" name="c password " placeholder="Confirm password" required>
            </div>

            <button class="btn">Register</button>
        </form>

        <div class="link">
            <p>Already have an account? <a href="{% url 'loginn' %}">Login</a></p>
        </div>
    </div>
<table border="2">
{% for data in Datas %}
    <tr>
        <td>{{data.id}}</td>
        <td>{{data.name}}</td>
        <td>{{data.email}}</td>
    </tr>
{% endfor %}
</table>
</body>
</html>
