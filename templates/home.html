<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#050816;
            color:white;
            overflow:hidden;
        }

        .hero{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            text-align:center;
            position:relative;
        }

        h1{
            font-size:70px;
            background:linear-gradient(90deg,#00f5ff,#8a2be2);
            background-clip:text;
            color:transparent;
            animation: glow 2s infinite alternate;
        }

        p{
            margin-top:20px;
            font-size:20px;
            color:#cfcfcf;
            width:60%;
        }

        .btn{
            margin-top:30px;
            padding:15px 40px;
            border:none;
            border-radius:50px;
            background:linear-gradient(90deg,#00f5ff,#8a2be2);
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.4s;
        }

        .btn:hover{
            transform:scale(1.1);
        }

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(138,43,226,0.2);
            animation: float 6s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:300px;
            height:300px;
            top:-100px;
            left:-100px;
        }

        .circle:nth-child(2){
            width:200px;
            height:200px;
            bottom:-50px;
            right:-50px;
        }

        @keyframes glow{
            from{
                text-shadow:0 0 10px #00f5ff;
            }
            to{
                text-shadow:0 0 30px #8a2be2;
            }
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(20px);
            }
            100%{
                transform:translateY(0px);
            }
        }
    </style>
</head>
<body>

    <div class="hero">

        <div class="circle"></div>
        <div class="circle"></div>

        <h1>AI Study Assistant</h1>

        <p>
            Learn smarter with AI. Ask questions, generate quizzes,
            summarize notes and improve your studies with intelligent help.
        </p>

        <button class="btn">Get Started</button>

    </div>

</body>
</html>
