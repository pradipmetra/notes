<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body {
            background: #0f2027;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: #e6e6e6;
            padding: 30px;
            border-radius: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p.info {
            font-size: 14px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2bbf9c;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #25a78a;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 10px;
        }

        .contact-info {
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #2bbf9c;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Contact Us</h2>

    <p class="info"><strong>MY PROJECT</strong></p>

    {% if success %}
        <p class="success">✅ Message sent successfully!</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
        <p><strong>Name:</strong> PRADIP METRA</p>
        <p><strong>Email:</strong> pradipmetra@gmail.com</p>
        <p><strong>Phone:</strong> +91 6352544817</p>
        <p><strong>Location:</strong> Rajkot</p>
    </div>

    <br>
    <a href="{% url 'dashboard' %}">⬅ Back to Dashboard</a>
</div>

</body> 
</html>
