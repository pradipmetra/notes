<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:700px;
    background:#111827;
    padding:30px;
    border-radius:20px;
}

textarea{
    width:100%;
    height:120px;
    background:#1f2937;
    border:none;
    outline:none;
    color:white;
    padding:15px;
    border-radius:15px;
    font-size:16px;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#8b5cf6;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.response{
    margin-top:30px;
    background:#1f2937;
    padding:20px;
    border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

    <h1>StudyAI 🤖</h1>

    <form method="POST">

        {% csrf_token %}

        <textarea 
        name="message"
        placeholder="Ask anything..."></textarea>

        <button type="submit">
            Ask AI
        </button>

    </form>

    {% if response %}

    <div class="response">

        {{ response }}

    </div>

    {% endif %}

</div>

</body>
</html>
